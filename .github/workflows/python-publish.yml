# Build and publish ft4ftirs to PyPI whenever a `v*` tag is pushed.
#
# The version is derived from the tag by setuptools-scm -- there is no
# version literal in the repository.  `fetch-depth: 0` below is therefore
# mandatory: a shallow clone carries no tags, and setuptools-scm would
# silently fall back to a `0.1.devN+g<sha>` version and publish garbage.
#
# Uploading uses PyPI Trusted Publishing (OIDC), so no API token is stored.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Mandatory: setuptools-scm needs the full history and the tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: pipx run build

      - name: Show the version that was built
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ft4ftirs
    permissions:
      # Required for Trusted Publishing; this is what replaces the API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
