[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ft4ftirs"
description = "A package for processing FTIR interferograms."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "GPL-3.0" }
authors = [
    { name = "Jon Gabirondo-López", email = "jon.gabirondol@ehu.eus" },
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "brukeropusreader>=1.3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# FER export/import (ft4ftirs.io.fer) is optional; the rest of the
# package does not import ferpy.
fer = ["ferpy"]

[project.urls]
Homepage = "https://github.com/jongablop/ft4ftirs"
Repository = "https://github.com/jongablop/ft4ftirs"

[tool.setuptools.packages.find]
include = ["ft4ftirs*"]
namespaces = false

# Presence of this table alone enables setuptools-scm: the version comes
# from the git tag, and from nowhere else.
[tool.setuptools_scm]
